<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0a0f1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Wilhelm Tyskeberge — Turkamerat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body {
      background: #0a0f1c;
      color: #e8e0d0;
      font-family: 'Georgia', 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      position: relative;
    }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 0 24px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card::before {
      content: '';
      position: absolute;
      bottom: 0; left: -40px; right: -40px; top: -140px;
      background: linear-gradient(to bottom, transparent 0%, #0a0f1c 52%);
      pointer-events: none;
      z-index: -1;
    }
    .mono { font-size: 13px; letter-spacing: 6px; color: #8090a0; margin-bottom: 5px; text-transform: uppercase; }
    .anno { font-size: 10px; letter-spacing: 4px; color: #50606e; margin-bottom: 26px; text-transform: uppercase; }
    h1 { font-size: 28px; font-weight: normal; letter-spacing: 1px; color: #e8e0d0; margin-bottom: 6px; text-align: center; }
    .sub { font-size: 13px; color: #7080a0; letter-spacing: 1px; margin-bottom: 22px; text-align: center; }
    .rule { width: 40px; height: 1px; background: #2a3a4a; margin-bottom: 22px; }
    .quote {
      font-size: 16px; line-height: 1.75; color: #b0b8c8;
      text-align: center; max-width: 310px;
      margin-bottom: 34px; font-style: italic;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: transparent; border: 1px solid #2a3a50;
      color: #c0ccd8; font-family: 'Georgia', serif;
      font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
      padding: 14px 36px; cursor: pointer; text-decoration: none;
      transition: border-color .25s, color .25s, background .25s;
    }
    .btn:hover { border-color: #4a6070; color: #e8f0f4; background: rgba(255,255,255,.035); }
    .btn:hover svg { transform: translateY(-2px); }
    .btn svg { transition: transform .25s; }
    .foot { margin-top: 18px; font-size: 10px; letter-spacing: 2px; color: #2a3848; text-transform: uppercase; }
  </style>
</head>

  </p>
